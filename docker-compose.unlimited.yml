# NVIDIA deployment: add this overlay to the base compose file.
services:
  api:
    environment:
      UNLIMITED_OCR_BASE_URL: http://unlimited:5004
  unlimited:
    build:
      context: .
      dockerfile: docker/unlimited/Dockerfile
    gpus: all
    restart: unless-stopped
    environment:
      UNLIMITED_DEVICE: cuda
    ports: ["127.0.0.1:5004:5004"]
    volumes: [unlimited_cache:/cache]
    networks: [doclyzer_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s
volumes:
  unlimited_cache:
