# Include inside the production server block; replace doclyzer_api with its upstream.
location = /v1/reports/processing/events {
    proxy_pass http://doclyzer_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 45s;
    add_header X-Accel-Buffering no;
    add_header Cache-Control "no-cache, no-store, no-transform";
}
