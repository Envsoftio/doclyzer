name: doclyzer

services:
  api-build:
    image: node:24-alpine
    working_dir: /workspace/apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doclyzer}:${POSTGRES_PASSWORD:-doclyzer_dev_password}@postgres:5432/${POSTGRES_DB:-doclyzer}
    command: sh -c "npm install && npm run build && npm run migration:run"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - doclyzer_net

  api:
    image: node:24-alpine
    container_name: doclyzer-api
    working_dir: /workspace/apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doclyzer}:${POSTGRES_PASSWORD:-doclyzer_dev_password}@postgres:5432/${POSTGRES_DB:-doclyzer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HOST: 0.0.0.0
      OPENDATALOADER_ENABLED: "false"
      LAB_OCR_BASE_URL: http://paddleocr:5005
      LAB_OCR_API_KEY: ${LAB_OCR_API_KEY:-}
      DOCLING_OCR_ENABLED: "true"
      DOCLING_OCR_BASE_URL: http://docling:5002
      REPORT_ASYNC_RUNTIME_ENABLED: "${REPORT_ASYNC_RUNTIME_ENABLED:-true}"
      REPORT_ASYNC_ACCEPTANCE_ENABLED: "${REPORT_ASYNC_ACCEPTANCE_ENABLED:-true}"
      REPORT_PROCESS_ROLE: api
    command: npm run start:prod
    ports:
      - "${PORT:-4002}:${PORT:-4002}"
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      api-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling:
        condition: service_healthy
      paddleocr:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doclyzer_net

  report-worker:
    image: node:24-alpine
    working_dir: /workspace/apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doclyzer}:${POSTGRES_PASSWORD:-doclyzer_dev_password}@postgres:5432/${POSTGRES_DB:-doclyzer}
      REPORT_ASYNC_RUNTIME_ENABLED: "true"
      REPORT_ASYNC_ACCEPTANCE_ENABLED: "false"
      REPORT_PROCESS_ROLE: worker
      DOCLING_OCR_BASE_URL: http://docling:5002
      LAB_OCR_BASE_URL: http://paddleocr:5005
      LAB_OCR_API_KEY: ${LAB_OCR_API_KEY:-}
      REPORT_WORKER_CONCURRENCY: "${REPORT_WORKER_CONCURRENCY:-1}"
      NODE_ENV: production
    command: npm run start:report-worker:prod
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      api-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      docling:
        condition: service_healthy
      paddleocr:
        condition: service_healthy
    stop_grace_period: 45s
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - doclyzer_net

  report-dispatcher:
    image: node:24-alpine
    working_dir: /workspace/apps/api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-doclyzer}:${POSTGRES_PASSWORD:-doclyzer_dev_password}@postgres:5432/${POSTGRES_DB:-doclyzer}
      REPORT_ASYNC_RUNTIME_ENABLED: "true"
      REPORT_ASYNC_ACCEPTANCE_ENABLED: "false"
      REPORT_PROCESS_ROLE: dispatcher
      NODE_ENV: production
    command: npm run start:report-dispatcher:prod
    volumes:
      - ./:/workspace
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      api-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    stop_grace_period: 45s
    mem_limit: 768m
    restart: unless-stopped
    networks:
      - doclyzer_net

  docling:
    build:
      context: .
      dockerfile: docker/docling/Dockerfile
    container_name: doclyzer-docling
    restart: unless-stopped
    mem_limit: 6g
    environment:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      PYTHON_GC_THRESHOLD: "700,10,10"
      DOCLING_SERVE_CUSTOM_OCR_PRESETS: '{"tesseract-table":{"kind":"tesseract","lang":["eng"],"psm":6,"tesseract_cmd":"/usr/local/bin/tesseract-table"}}'
      DOCLING_SERVE_OCR_ENGINE: ${DOCLING_OCR_ENGINE:-rapidocr}
    command: >
      sh -c "docling-serve run --host 0.0.0.0 --port 5002 --workers 1"
    ports:
      - "5002:5002"
    volumes:
      - docling_cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/docs', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - doclyzer_net

  paddleocr:
    build:
      context: .
      dockerfile: docker/paddleocr/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 5g
    environment:
      LAB_OCR_DPI: "${LAB_OCR_DPI:-300}"
      LAB_OCR_API_KEY: ${LAB_OCR_API_KEY:-}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      LAB_OCR_PAGE_TIMEOUT_SEC: "60"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:5005/health',timeout=3))['ready'] else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - doclyzer_net

  paddleocr-vl:
    profiles: ["lab-vl"]
    build:
      context: .
      dockerfile: docker/paddleocr-vl/Dockerfile
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 2560m
    environment:
      LAB_VL_API_KEY: ${REPORT_VL_API_KEY:-}
      LAB_VL_BACKEND_API_KEY: ${LAB_VL_BACKEND_API_KEY:-}
      LAB_VL_LAYOUT_DIR: /models/PP-DocLayoutV3
      LAB_VL_SERVER_URL: ${LAB_VL_SERVER_URL:-http://vl-llama:8080/v1}
      LAB_VL_PAGE_TIMEOUT_SEC: "60"
    volumes:
      - ${LAB_VL_LAYOUT_MODEL_DIR:-./.local-models/paddleocr-vl/PP-DocLayoutV3}:/models/PP-DocLayoutV3:ro
    depends_on:
      vl-llama:
        condition: service_healthy
    networks:
      - doclyzer_net

  vl-llama:
    profiles: ["lab-vl"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    mem_limit: 3g
    command: ["-m", "/models/PaddleOCR-VL-1.6-GGUF.gguf", "--mmproj", "/models/PaddleOCR-VL-1.6-GGUF-mmproj.gguf", "--host", "0.0.0.0", "--port", "8080", "-t", "8", "-ngl", "0", "-c", "16384", "-np", "1", "--api-key", "${LAB_VL_BACKEND_API_KEY:-unset}"]
    volumes:
      - ${LAB_VL_GGUF_MODEL_DIR:-./.local-models/paddleocr-vl/gguf}:/models:ro
    networks:
      - doclyzer_net

  postgres:
    image: postgres:16-alpine
    container_name: doclyzer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doclyzer}
      POSTGRES_USER: ${POSTGRES_USER:-doclyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doclyzer_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - doclyzer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doclyzer} -d ${POSTGRES_DB:-doclyzer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doclyzer_net

  redis:
    image: redis:7-alpine
    container_name: doclyzer-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - doclyzer_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doclyzer_net

volumes:
  api_node_modules:
  doclyzer_postgres_data:
  doclyzer_redis_data:
  docling_cache:

networks:
  doclyzer_net:
    driver: bridge
